<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />

    <!-- 🧠 meta المتغيرة (title/description/canonical/OG/Twitter)
         بقت بتتضاف عبر react-helmet-async داخل الصفحات -->

    <!-- Optional i18n for homepage only (لو هتسيبه دلوقتي): -->
    <!-- <link rel="alternate" href="https://buddytourguide.com/" hreflang="x-default" />
    <link rel="alternate" href="https://buddytourguide.com/" hreflang="en-eg" /> -->

    <!-- ✅ JSON-LD ثابت: Organization -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "BuddyTour",
        "url": "https://buddytourguide.com",
        "logo": "https://buddytourguide.com/favicon.ico",
        "description": "BuddyTour is a tourism marketplace connecting travelers with local guides in Alexandria, Egypt and worldwide.",
        "address": {
          "@type": "PostalAddress",
          "addressLocality": "Alexandria",
          "addressCountry": "EG"
        },
        "contactPoint": {
          "@type": "ContactPoint",
          "telephone": "+20-XXX-XXX-XXXX",
          "contactType": "customer service",
          "availableLanguage": ["en","ar"]
        },
        "sameAs": [
          "https://www.facebook.com/yourpage",
          "https://www.instagram.com/yourpage",
          "https://www.linkedin.com/company/yourpage"
        ]
      }
    </script>

    <!-- ✅ JSON-LD ثابت: WebSite + SearchAction -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "BuddyTour",
        "url": "https://buddytourguide.com/",
        "inLanguage": "en",
        "potentialAction": {
          "@type": "SearchAction",
          "target": "https://buddytourguide.com/?q={search_term_string}",
          "query-input": "required name=search_term_string"
        }
      }
    </script>

    <!-- Favicons/manifest (لو عندك) -->
    <!-- <link rel="icon" href="/favicon.ico" /> -->
    <!-- <link rel="manifest" href="/site.webmanifest" /> -->

    <!-- ✅ Paysky Payment Gateway Scripts -->
    <script src="https://cube.paysky.io:6006/js/LightBox.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
  </head>


  <body>
    <div id="root"></div>
    <script type="module" src="/main.tsx"></script>
  </body>
</html>
