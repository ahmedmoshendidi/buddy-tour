<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Alexandria Tours & Guides | Book Local Trips with BuddyTour</title>

  <meta name="description" content="Discover and book affordable Alexandria tours with expert local guides. Explore Egypt’s best sights with BuddyTour. Easy online booking!" />
  <meta name="keywords" content="Alexandria tour, Egypt tours, tour guide Alexandria, walking tour, Buddy Tour" />
  <meta name="robots" content="index, follow" />

  <!-- ✅ Canonical tag -->
  <link rel="canonical" href="https://buddy-tour-production.up.railway.app/" />

  <!-- ✅ OG Meta tags (Social sharing) -->
  <meta property="og:title" content="BuddyTour - Alexandria Tours with Local Guides" />
  <meta property="og:description" content="Book amazing experiences in Alexandria with trusted local tour guides." />
  <meta property="og:image" content="https://buddy-tour-production.up.railway.app/images/roman%20theatre.jpg" />
  <meta property="og:url" content="https://buddy-tour-production.up.railway.app/" />
  <meta property="og:type" content="website" />

  <!-- ✅ JSON-LD Structured Data -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "TouristDestination",
    "name": "BuddyTour",
    "url": "https://buddy-tour-production.up.railway.app/",
    "description": "Book Alexandria tours with expert local guides. Explore Egypt’s top attractions easily with BuddyTour.",
    "image": "https://buddy-tour-production.up.railway.app/images/roman%20theatre.jpg",
    "address": {
      "@type": "PostalAddress",
      "addressLocality": "Alexandria",
      "addressCountry": "EG"
    }
  }
  </script>

  <link rel="icon" href="favicon.ico" type="image/x-icon" />
  <link rel="stylesheet" href="css/all.css" />

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
    }

    header {
      background-color: #1abc9c;
      padding: 20px;
      color: white;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
    }

    header h1 {
      margin: 0;
      font-size: 24px;
    }

    nav {
      margin-top: 10px;
    }

    nav a {
      color: white;
      text-decoration: none;
      margin-left: 20px;
      font-weight: bold;
    }

    .hero {
      position: relative;
      height: 300px;
      overflow: hidden;
      color: white;
      text-align: center;
      display: flex;
      justify-content: center;
      align-items: center;
      flex-direction: column;
      padding: 10px;
    }

    .hero-bg {
      position: absolute;
      top: 0;
      left: 100%;
      width: 100%;
      height: 100%;
      background-size: cover;
      background-position: center;
      transition: left 1s ease-in-out;
      z-index: 0;
    }

    .hero-bg.active {
      left: 0;
      z-index: 1;
    }

    .hero h2, .hero p {
      position: relative;
      z-index: 2;
      margin: 0.5em;
      text-shadow: 2px 2px 4px rgba(0,0,0,0.6);
    }

    .hero h2 {
      font-size: 24px;
      font-weight: bold;
    }

    .hero p {
      font-size: 16px;
    }

    .listing {
      padding: 20px;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 20px;
      max-width: 1200px;
      margin: auto;
    }

    .tour-card {
      background-color: white;
      border-radius: 8px;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.1);
      overflow: hidden;
      cursor: pointer;
      text-decoration: none;
      color: inherit;
      transition: transform 0.2s ease-in-out;
    }

    .tour-card:hover {
      transform: scale(1.02);
    }

    .tour-card img {
      width: 100%;
      height: 200px;
      object-fit: cover;
    }

    .tour-card .content {
      padding: 15px;
    }

    .tour-card .content h3 {
      margin: 0 0 10px 0;
      font-size: 20px;
    }

    .tour-card .content p {
      font-size: 14px;
      color: #555;
    }

    .tour-card .content p i {
      margin-right: 8px;
      color: #1abc9c;
    }

    @media (max-width: 480px) {
      .hero h2 {
        font-size: 20px;
      }
      .hero p {
        font-size: 14px;
      }
    }
  </style>
</head>
<body>
  <header>
    <h1>BuddyTour</h1>
    <nav>
      <a href="#">Home</a>
      <a href="#">About</a>
      <a href="#">Contact</a>
    </nav>
  </header>

  <section class="hero">
    <div id="bg1" class="hero-bg active" style="background-image: url('images/roman theatre.jpg');"></div>
    <div id="bg2" class="hero-bg"></div>

    <h2 id="headline">Explore Roman Theatre with Your Local Buddy</h2>
    <p>Book unique experiences led by locals in the beautiful coastal city of Alexandria, Egypt.</p>
  </section>

  <section class="listing" id="tour-listing"></section>

  <script>
fetch('/api/tours')
  .then(res => res.json())
  .then(data => {
    const container = document.getElementById('tour-listing');
    container.innerHTML = '';

    data.tours.forEach(tour => {
      const card = document.createElement('a');
      card.className = 'tour-card';
      card.href = `tour-details.html?tour_id=${tour.id}`;

      const imageSrc = (tour.image_urls && tour.image_urls.length > 0)
        ? tour.image_urls[0]
        : 'https://via.placeholder.com/400x200?text=No+Image';

      card.innerHTML = `
        <img src="${imageSrc}" alt="${tour.title}" />
        <div class="content">
          <h3>${tour.title}</h3>
          <p>${tour.description}</p>
          <p><i class="fa-solid fa-clock"></i> Duration: ${tour.duration}</p>
          <p><i class="fa-solid fa-users"></i> Group Size: up to ${tour.max_group_size} people</p>
          <p><i class="fa-solid fa-dollar-sign"></i> Price: $${tour.price_per_person}</p>
        </div>
      `;

      container.appendChild(card);
    });
  })
  .catch(err => {
    console.error("Failed to load tours:", err);
  });
</script>


  <script>
    const images = [
      { src: 'images/roman theatre.jpg', title: 'Roman Theatre' },
      { src: 'images/montaza palace.jpg', title: 'Montaza Palace' },
      { src: 'images/qaitbay citadel.jpg', title: 'Qaitbay Citadel' },
      { src: 'images/Bibliotheca Alexandrina.jpg', title: 'Bibliotheca Alexandrina' }
    ];

    let index = 0;
    const bg1 = document.getElementById('bg1');
    const bg2 = document.getElementById('bg2');
    const headline = document.getElementById('headline');
    let showingBg1 = true;

    function updateHero() {
      const current = images[index];
      const nextIndex = (index + 1) % images.length;
      const next = images[nextIndex];

      const activeBg = showingBg1 ? bg1 : bg2;
      const inactiveBg = showingBg1 ? bg2 : bg1;

      inactiveBg.style.backgroundImage = `url('${next.src}')`;
      inactiveBg.style.left = '100%';
      inactiveBg.style.zIndex = 2;
      activeBg.style.zIndex = 1;

      setTimeout(() => {
        inactiveBg.style.transition = 'left 1s ease-in-out';
        activeBg.style.transition = 'left 1s ease-in-out';

        inactiveBg.style.left = '0%';
        activeBg.style.left = '-100%';
      }, 20);

      setTimeout(() => {
        activeBg.style.transition = 'none';
        activeBg.style.left = '100%';
      }, 1100);

      headline.textContent = `Explore ${next.title} with Your Local Buddy`;
      index = nextIndex;
      showingBg1 = !showingBg1;
    }

    window.addEventListener('DOMContentLoaded', () => {
      bg1.style.backgroundImage = `url('${images[0].src}')`;
      bg1.style.left = '0%';
      bg1.style.zIndex = 2;
      bg2.style.left = '100%';
      bg2.style.zIndex = 1;

      setInterval(updateHero, 5000);
    });
  </script>
</body>
</html>
