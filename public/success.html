<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تم الدفع بنجاح | BuddyTour</title>
  <meta name="robots" content="noindex, nofollow" />
  <style>
    body {
      font-family: 'Tahoma', sans-serif;
      background-color: #f5f5f5;
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      text-align: center;
      color:#111827;
    }
    .container {
      background-color: white;
      border-radius: 12px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.08);
      padding: 28px;
      width: 92%;
      max-width: 560px;
      margin: 20px;
    }
    h1 {
      color: #16a34a;
      margin: 12px 0 8px;
      font-size: 1.6rem;
    }
    .success-icon {
      font-size: 3.6rem;
      color: #16a34a;
      margin-bottom: 10px;
      line-height: 1;
    }
    .order-info {
      background-color: #f8fafc;
      border: 1px solid #e5e7eb;
      border-radius: 10px;
      padding: 14px 16px;
      margin: 18px 0;
      text-align: start;
    }
    .row { margin: 6px 0; }
    .label { color:#6b7280; font-size: .92rem; }
    .val { font-weight: 600; }
    .msg { color:#111827; margin-top:6px }
    .btn {
      display: inline-block;
      background-color: #16a34a;
      color: white;
      padding: 10px 18px;
      border-radius: 8px;
      text-decoration: none;
      margin-top: 14px;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="success-icon">✓</div>
    <h1>تمت عملية الدفع بنجاح</h1>
    <p class="msg" id="gateway-msg"></p>

    <div class="order-info">
      <div class="row">
        <span class="label">رقم العملية:</span>
        <span class="val" id="transaction-id"></span>
      </div>
      <div class="row">
        <span class="label">المبلغ:</span>
        <span class="val"><span id="amount"></span> <span id="currency">EGP</span></span>
      </div>
      <div class="row">
        <span class="label">التاريخ:</span>
        <span class="val" id="created-at"></span>
      </div>
    </div>

    <a href="/" class="btn">العودة للصفحة الرئيسية</a>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', function () {
      const p = new URLSearchParams(window.location.search);

      // رقم العملية: فضّل id، وإلا خُد order كبديل
      const txnId = p.get('id') || p.get('order') || 'غير متاح';
      document.getElementById('transaction-id').textContent = txnId;

      // المبلغ
      const cents = parseInt(p.get('amount_cents') || '0', 10);
      const amount = isFinite(cents) ? (cents / 100) : 0;
      document.getElementById('amount').textContent = amount.toLocaleString('ar-EG', {
        minimumFractionDigits: 2, maximumFractionDigits: 2
      });

      // العملة (لو جت من البوابة)
      const currency = (p.get('currency') || 'EGP').toUpperCase();
      document.getElementById('currency').textContent = currency;

      // رسالة البوابة (data.message أو message)
      const msg = p.get('data.message') || p.get('message') || '';
      if (msg) document.getElementById('gateway-msg').textContent = msg;

      // تاريخ الإنشاء (اختياري)
      const created = p.get('created_at');
      if (created) {
        try {
          const d = new Date(created);
          document.getElementById('created-at').textContent =
            isNaN(d) ? 'غير متاح' : d.toLocaleString('ar-EG');
        } catch {
          document.getElementById('created-at').textContent = 'غير متاح';
        }
      } else {
        document.getElementById('created-at').textContent = 'غير متاح';
      }
    });
  </script>
</body>
</html>
