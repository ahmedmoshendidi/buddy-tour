<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Payment Response | BuddyTour</title>
  <meta name="robots" content="noindex, nofollow" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    body {
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      margin: 0;
      background: #0f172a;
      color: #fff;
    }
    .wrap {
      max-width: 720px;
      margin: 0 auto;
      padding: 48px 20px;
      text-align: center;
    }
    .card {
      background: #0b1220;
      border: 1px solid #1f2a44;
      border-radius: 16px;
      padding: 32px;
    }
    .muted {
      color: #9ca3af;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <h1>Processing payment…</h1>
      <p class="muted">Please wait, you will be redirected shortly.</p>
    </div>
  </div>

<script>
(async function () {
  const transactionUuid = localStorage.getItem("transaction_uuid");

  if (!transactionUuid) {
    console.warn("❌ No transaction UUID found in localStorage.");
    location.replace("/payment-result?success=false");
    return;
  }

  let success = false;
  let attempts = 0;
  const maxAttempts = 5;

  while (attempts < maxAttempts && !success) {
    attempts++;
    console.log(`🔄 Verification attempt ${attempts}/${maxAttempts}`);

    try {
      // const res = await fetch(`/api/xpay/verify/${transactionUuid}`);
      const res = await fetch(`https://buddy-tour-staging.up.railway.app/api/xpay/verify/${transactionUuid}`);
      const data = await res.json();

      console.log("📦 Response:", data);

      success = ["successful", "completed", "SUCCESSFUL", "COMPLETED"].includes(data.status);

      if (success) {
        console.log("✅ Payment verified successfully!");
        break;
      }

      // لو مش ناجحة، استنى ثانية وحاول تاني
      if (attempts < maxAttempts) {
        await new Promise(resolve => setTimeout(resolve, 1500));
      }

    } catch (err) {
      console.error(`❌ Attempt ${attempts} failed:`, err);
      if (attempts < maxAttempts) {
        await new Promise(resolve => setTimeout(resolve, 1500));
      }
    }
  }

  if (success) {
    const raw = localStorage.getItem("bookingData");
    const booking = raw ? JSON.parse(raw) : null;

    if (booking && booking.session_id) {
      localStorage.setItem("paid_booking", JSON.stringify({
        session_id: booking.session_id,
        at: Date.now()
      }));
    }

    localStorage.removeItem("bookingData");
    if (booking?.tour_id) {
      localStorage.removeItem(`buddy_tour_session_${booking.tour_id}`);
    }
  }

  location.replace(`/payment-result?success=${success}`);

})();
</script>
</body>
</html>
