<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Redirecting... | BuddyTour</title>
  <meta name="robots" content="noindex, nofollow" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <script>
    // Instant redirect to the React result page
    const url = new URL(window.location.href);
    const params = url.searchParams;
    
    // Check for Kashier specific success
    const isSuccess = params.get('paymentStatus') === 'SUCCESS' || params.get('status') === 'SUCCESS';
    
    if (isSuccess) {
      window.location.replace('/payment/success' + url.search);
    } else {
      // If failed or unknown, go to success anyway (the page will handle status)
      window.location.replace('/payment/success' + url.search);
    }
  </script>
  <style>
    body { 
      background: #0f172a; 
      display: flex; 
      align-items: center; 
      justify-content: center; 
      height: 100vh; 
      margin: 0; 
      color: #9ca3af; 
      font-family: system-ui, -apple-system, sans-serif; 
    }
  </style>
</head>
<body>
  <p>Redirecting to your booking details...</p>
</body>
</html>
