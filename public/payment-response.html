<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Payment Response | BuddyTour</title>
  <meta name="robots" content="noindex, nofollow" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    body {
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      margin: 0;
      background: #0f172a;
      color: #fff;
    }
    .wrap {
      max-width: 720px;
      margin: 0 auto;
      padding: 48px 20px;
      text-align: center;
    }
    .card {
      background: #0b1220;
      border: 1px solid #1f2a44;
      border-radius: 16px;
      padding: 32px;
    }
    .muted {
      color: #9ca3af;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <h1>Processing payment…</h1>
      <p class="muted">Please wait, you will be redirected shortly.</p>
    </div>
  </div>

  <script>
  (function () {
    const q = new URLSearchParams(location.search);
    const pick = k => (q.get(k) || '').toLowerCase();

    // تحديد النجاح من باراميترات Paymob/الرد
    const success =
      pick('success') === 'true' ||
      pick('payment_status') === 'success' ||
      pick('status') === 'completed' ||
      ((q.get('txn_response_code') || '').toUpperCase().startsWith('APPROVED') &&
       pick('error_occured') !== 'true');

    // ✅ لو الدفع نجح: اكتب علامة الدفع ونضّف بيانات الحجز
    if (success) {
      try {
        const raw = localStorage.getItem('bookingData');
        const data = raw ? JSON.parse(raw) : null;

        // اكتب علامة الدفع بالـ session_id عشان SuccessCleanup يشيل عنصر الكارت المقابل
        if (data && data.session_id) {
          localStorage.setItem('paid_booking', JSON.stringify({
            session_id: data.session_id,
            at: Date.now()
          }));
        }

        // امسح بيانات الشيك آوت (ده اللي بيعتمد عليه العداد)
        localStorage.removeItem('bookingData');

        // امسح سيشن الحجز الخاص بالتور (لو موجود)
        if (data && data.tour_id) {
          localStorage.removeItem(`buddy_tour_session_${data.tour_id}`);
        }

        // ملاحظة: ما بنلمسش الـ wishlist — هتفضل زي ما هي 👌
      } catch (e) {
        // تجاهل أي أخطاء parsing بسيطة
      }
    }

    // ✅ تعديل واحد فقط: التحويل إلى /payment-result بدل /
    const next = new URL('/payment-result', location.origin);
    q.forEach((v, k) => next.searchParams.set(k, v));
    next.searchParams.set('status', success ? 'success' : 'failed');
    next.searchParams.set('success', success ? 'true' : 'false');

    // استخدم replace عشان ما تزودش history entry
    location.replace(next.toString());
  })();
  </script>
</body>
</html>
