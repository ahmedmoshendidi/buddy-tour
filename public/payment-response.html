<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Payment Response | BuddyTour</title>
  <meta name="robots" content="noindex, nofollow" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    body {
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      margin: 0;
      background: #0f172a;
      color: #fff;
    }
    .wrap {
      max-width: 720px;
      margin: 0 auto;
      padding: 48px 20px;
      text-align: center;
    }
    .card {
      background: #0b1220;
      border: 1px solid #1f2a44;
      border-radius: 16px;
      padding: 32px;
    }
    .muted {
      color: #9ca3af;
    }
    #debug-log {
      margin-top: 20px;
      text-align: left;
      background: #1e293b;
      padding: 16px;
      border-radius: 8px;
      font-family: monospace;
      font-size: 12px;
      max-height: 300px;
      overflow-y: auto;
    }
    .log-line {
      margin: 4px 0;
      padding: 4px;
      border-left: 3px solid #3b82f6;
      padding-left: 8px;
    }
    .log-success { border-color: #10b981; color: #10b981; }
    .log-error { border-color: #ef4444; color: #ef4444; }
    .log-warning { border-color: #f59e0b; color: #f59e0b; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <h1>Processing payment…</h1>
      <p class="muted">Please wait, you will be redirected shortly.</p>
      <div id="debug-log"></div>
    </div>
  </div>

<script>
(async function () {
  addLog('🚀 Starting payment verification...');
  
  // 🔍 Try multiple sources for transaction UUID
  const urlParams = new URLSearchParams(window.location.search);
  const transactionUuid = 
    localStorage.getItem("transaction_uuid") ||   // من localStorage
    urlParams.get('transaction_id') ||            // من XPay redirect URL ✅
    urlParams.get('txn') ||
    urlParams.get('id');

  addLog(`🔑 Transaction UUID: ${transactionUuid || 'NOT FOUND'}`, transactionUuid ? 'success' : 'error');

  if (!transactionUuid) {
    addLog('❌ No transaction UUID found - redirecting to failure', 'error');
    await new Promise(resolve => setTimeout(resolve, 2000));
    location.replace("/payment-result?success=false");
    return;
  }

  // ✅ حفظ الـ UUID في localStorage للمرة الجاية
  if (!localStorage.getItem("transaction_uuid")) {
    localStorage.setItem("transaction_uuid", transactionUuid);
    addLog('💾 Saved UUID to localStorage', 'success');
  }

  let success = false;
  let attempts = 0;
  const maxAttempts = 5;

  while (attempts < maxAttempts && !success) {
    attempts++;
    addLog(`🔄 Verification attempt ${attempts}/${maxAttempts}`, 'warning');

    try {
      const apiUrl = `https://buddy-tour-staging.up.railway.app/api/xpay/verify/${transactionUuid}`;
      addLog(`🌐 Calling: ${apiUrl}`);
      
      const res = await fetch(apiUrl);
      addLog(`📡 Response status: ${res.status}`);
      
      if (!res.ok) {
        throw new Error(`API returned ${res.status}`);
      }
      
      const data = await res.json();
      addLog(`📦 Response: ${JSON.stringify(data)}`);
      addLog(`🔍 Status: "${data.status}"`);

      success = ["successful", "completed", "SUCCESSFUL", "COMPLETED"].includes(data.status);
      
      addLog(`✨ Success: ${success}`, success ? 'success' : 'warning');

      if (success) {
        addLog('✅ Payment verified!', 'success');
        break;
      }

      if (["failed", "FAILED", "cancelled", "CANCELLED"].includes(data.status)) {
        addLog(`❌ Payment failed: ${data.status}`, 'error');
        break;
      }

      if (attempts < maxAttempts) {
        addLog(`⏳ Waiting 1.5s...`, 'warning');
        await new Promise(resolve => setTimeout(resolve, 1500));
      }

    } catch (err) {
      addLog(`❌ Attempt ${attempts} error: ${err.message}`, 'error');
      if (attempts < maxAttempts) {
        await new Promise(resolve => setTimeout(resolve, 1500));
      }
    }
  }

  // Cleanup
  if (success) {
    addLog('🧹 Cleaning localStorage...', 'success');
    const raw = localStorage.getItem("bookingData");
    const booking = raw ? JSON.parse(raw) : null;

    if (booking?.session_id) {
      localStorage.setItem("paid_booking", JSON.stringify({
        session_id: booking.session_id,
        at: Date.now()
      }));
    }

    localStorage.removeItem("bookingData");
    localStorage.removeItem("transaction_uuid");
    if (booking?.tour_id) {
      localStorage.removeItem(`buddy_tour_session_${booking.tour_id}`);
    }
    addLog('✅ Cleanup done', 'success');
  }

  const redirectUrl = `/payment-result?success=${success}`;
  addLog(`🔄 Redirecting to: ${redirectUrl}`, success ? 'success' : 'error');
  
  alert(`Payment: ${success ? 'SUCCESS ✅' : 'FAILED ❌'}\n\nRedirecting to: ${redirectUrl}`);
  
  await new Promise(resolve => setTimeout(resolve, 1000));
  location.replace(redirectUrl);

})();
</script>
</body>
</html>
