<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Payment Response | BuddyTour</title>
  <meta name="robots" content="noindex, nofollow" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    body{font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;margin:0;background:#0f172a;color:#fff}
    .wrap{max-width:720px;margin:0 auto;padding:48px 20px;text-align:center}
    .card{background:#0b1220;border:1px solid #1f2a44;border-radius:16px;padding:32px}
    .muted{color:#9ca3af}
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <h1>Processing payment…</h1>
      <p class="muted">Please wait, you will be redirected shortly.</p>
    </div>
  </div>

  <script>
  (function () {
    const q = new URLSearchParams(location.search);
    const pick = k => (q.get(k) || '').toLowerCase();

    // حدد النجاح بشكل أوسع
    const success =
      pick('success') === 'true' ||
      pick('payment_status') === 'success' ||
      pick('status') === 'completed' ||
      (q.get('txn_response_code') || '').toUpperCase().startsWith('APPROVED') && pick('error_occured') !== 'true';

    // هنحوّل للـ SPA root
    const next = new URL('/', location.origin);

    // انسخ كل البراميترات الأصلية
    q.forEach((v, k) => next.searchParams.set(k, v));

    // طبّع علامات موحّدة عشان App.tsx يلقطها بسهولة
    next.searchParams.set('status', success ? 'success' : 'failed');
    next.searchParams.set('success', success ? 'true' : 'false');

    // لو مش مهم تحتفظ بالـ query في الهيستوري، استعمل replace
    location.replace(next.toString());
  })();
</script>

</body>
</html>
